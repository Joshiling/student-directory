@if (loading) {
  <p>Loading student…</p>
} @else if (errorMessage) {
  <p>{{ errorMessage }}</p>
} @else if (student) {
  <h2>{{ student.name }}</h2>
  <p  [style.color]="student.score > 80 ? '#00FF00' : student.score > 50 ? '#AACC00' : '#FF0000'">Score: {{ student.score }}</p>
} @else {
  <p>Student not found.</p>
}
